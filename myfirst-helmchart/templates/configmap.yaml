apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sk026.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sk026.labels" . | nindent 4 }}
data:
  application-prod.yaml: |
    server:
      port: 8080
    developer:
      owner:
        name: {{ .Values.student }}
        role: helm-{{ .Values.labVersion }}
        level: high
      team:
        position: "5th floor"
        detail: {{ .Values.className }}
    spring:
      datasource:
        url: jdbc:h2:mem:helmdb
        driver-class-name: org.h2.Driver
        username: sa
        password:
      jpa:
        hibernate:
          ddl-auto: create-drop
        defer-datasource-initialization: true
      sql:
        init:
          mode: always
