apiVersion: v1
kind: Service
metadata:
  name: {{ include "sk026.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sk026.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "sk026.selectorLabels" . | nindent 4 }}
